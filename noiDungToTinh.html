<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kết quả phân tích trái tim</title>
    <link rel="icon" type="image/png" href="Gemini_Generated_Image_dvvwwqdvvwwqdvvw.png" sizes="32x32">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff5f7 0%, #fce4ec 100%);
            --accent: #ff5e7e;
            --text: #2d3436;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(255, 94, 126, 0.15);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: containerShow 0.8s ease-out;
        }

        .couple-names {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: var(--accent);
        }

        .heart-loading {
            font-size: 2rem;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .result-score {
            font-size: 3.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff5e7e, #ff9a9e);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
        }

        #content {
            font-size: 1.2rem;
            line-height: 1.6;
            color: var(--text);
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 20px 15px;
            border-top: 1px dashed #ffcad4;
            
        }

        .btn-back {
            margin-top: 25px;
            display: inline-block;
            padding: 10px 30px;
            background: white;
            color: #999;
            border: 1px solid #eee;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .btn-back:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        @keyframes containerShow {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }


        input[type="button"] {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(45deg, #ff5e7e, #ff9a9e);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        /* hover */
        input[type="button"]:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 94, 126, 0.4);
        }

        /* khi bấm */
        input[type="button"]:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="couple-names">
            <span id="name1"></span>
            <span class="heart-loading">❤️</span>
            <span id="name2"></span>
        </div>

        <div id="loading-section">
            <div class="result-score" id="score">0%</div>
            </div>
        
        <div id="content"></div>
        
        <input type="button" value="copy link" onclick="copyLink()" >
    </div>

    <script>
        function copyLink() {
            const link = window.location.href;

            navigator.clipboard.writeText(link)
                .then(() => {
                    alert("Đã copy link 👍");
                })
                .catch(() => {
                    alert("Không copy được 😢");
                });
        }





        const urlParams = new URLSearchParams(window.location.search);
        

        // mã hoá 
        function decodeBase64(str) {
            try {
                return decodeURIComponent(escape(atob(str)));
            } catch (e) {
                return "...";
            }
        }

        
        const n1 = decodeBase64(urlParams.get('n1'));
        const n2 = decodeBase64(urlParams.get('n2'));
        const score = decodeBase64(urlParams.get('score'));
        const msg = decodeBase64(urlParams.get('msg'));

        document.getElementById("name1").innerText = n1;
        document.getElementById("name2").innerText = n2;
        document.getElementById("score").innerText = score + "%";
        document.getElementById("content").innerText = msg;

        // bắn páo
        window.onload = function() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 }
            });
        };
    </script>
</body>
</html>
