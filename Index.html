            <div id="thongTinBan">
                <label for="tenBan">nhập tên bạn</label>
                <input type="text" placeholder="nhập tên" id="tenBan">
                <div id="ntnI">
                    <label for="nsBan">nhập ngày sinh của bạn</label>
                    <input type="number" id="nsBan" placeholder="ngày">
                    <select name="tháng" id="thangSinhBan">
                        <option value="">Tháng</option>
                        <script>
                            for(let i=1;i<=12;i++){
                                document.writeln(`<option value="${i}">Tháng ${i}</option>`)
                            }
                        </script>
                    </select>
                    <input type="number" id="namSinhBan" placeholder="năm">
                </div>
                <div class="gender-select1">
                    <input type="radio" name="genderBan" value="nam" id="maleBan">

                    <input type="radio" name="genderBan" value="nu" id="femaleBan">

                </div>
            </div>
            <div id="thongTinNguoiAy">

                    <select name="tháng" id="thangSinhNguoiAy">
                        <option value="">Tháng</option>
                        <script>
                            for(let i=1;i<=12;i++){
                                document.writeln(`<option value="${i}">Tháng ${i}</option>`)
                            }
                        </script>
                    </select>
                    <input type="number" id="namSinhNguoiAy" placeholder="năm">
                </div>
                <div class="gender-select1">
                    <input type="radio" name="genderNguoiAy" value="nam" id="maleNguoiAy">
                    <label for="maleNguoiAy">NAM</label>
                
                    <input type="radio" name="genderNguoiAy" value="nu" id="femaleNguoiAy">
                    <label for="femaleNguoiAy">NỮ</label>
                </div>
            </div>
            <div id="row">
                <input type="button" value="Tính toán" onclick="tinhToan()">
